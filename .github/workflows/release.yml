name: Release TikTok-Now

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  CARGO_HTTP_CHECK_REVOKE: "false"
  CARGO_INCREMENTAL: "0"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Windows Build
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build — Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name || inputs.tag }}"
          $src = "src-tauri\target\release\TikTok-Now.exe"
          $dst = "TikTok-Now_${tag}_windows-x86_64.exe"
          Copy-Item $src $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$dst  sha256:$hash" | Out-File -Encoding utf8 checksums-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            TikTok-Now_${{ github.ref_name || inputs.tag }}_windows-x86_64.exe
            checksums-windows.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # macOS Build — Universal Binary (Apple Silicon + Intel)
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 Build — macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build for Intel (x86_64)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for Apple Silicon (aarch64)
        working-directory: src-tauri
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary with lipo
        run: |
          lipo -create \
            src-tauri/target/x86_64-apple-darwin/release/TikTok-Now \
            src-tauri/target/aarch64-apple-darwin/release/TikTok-Now \
            -output TikTok-Now_${{ github.ref_name || inputs.tag }}_macos-universal

      - name: Make executable & checksum
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          BIN="TikTok-Now_${TAG}_macos-universal"
          chmod +x "$BIN"
          shasum -a 256 "$BIN" > checksums-macos.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            TikTok-Now_${{ github.ref_name || inputs.tag }}_macos-universal
            checksums-macos.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Linux Build — x86_64
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Build — Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKit2GTK + Tauri v2 requirements)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          SRC="src-tauri/target/release/TikTok-Now"
          DST="TikTok-Now_${TAG}_linux-x86_64"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          sha256sum "$DST" > checksums-linux.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            TikTok-Now_${{ github.ref_name || inputs.tag }}_linux-x86_64
            checksums-linux.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release (all platforms combined)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Combine checksums into one file
        run: |
          cat dist/checksums-windows.txt dist/checksums-macos.txt dist/checksums-linux.txt > dist/checksums.txt

      - name: Resolve tag name
        id: tag
        run: echo "value=${{ github.ref_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "TikTok-Now ${{ steps.tag.outputs.value }}"
          body: |
            ## 🎬 TikTok-Now Desktop — ${{ steps.tag.outputs.value }}

            A high-performance TikTok desktop wrapper powered by **Rust + Tauri v2**.
            Sub-10 MB binary. No Electron. No Node.js. Pure speed.

            ---

            ### 📦 Downloads

            | Platform | File |
            |---|---|
            | 🪟 Windows (x86_64) | `TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe` |
            | 🍎 macOS (Universal — Intel + Apple Silicon) | `TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal` |
            | 🐧 Linux (x86_64) | `TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64` |

            SHA256 checksums are in `checksums.txt`.

            **Windows:** just run the `.exe` — no installation needed.
            **macOS:** `chmod +x TikTok-Now_*_macos-universal && ./TikTok-Now_*_macos-universal` (you may need to allow it in System Settings › Privacy & Security).
            **Linux:** `chmod +x TikTok-Now_*_linux-x86_64 && ./TikTok-Now_*_linux-x86_64` (requires `libwebkit2gtk-4.1` and `libgtk-3`).

            ---

            ### ✨ Features
            - 🔥 Full TikTok feed — For You, Following, Friends, Live, Explore
            - ⌨️ Rich keyboard shortcuts (see cheatsheet in **ℹ️ About TikTok-Now** tray menu)
            - 📌 Always-on-top pinning
            - 🖼️ Picture-in-Picture support
            - 📜 Auto-Scroll mode
            - 🔄 One-click feed refresh from system tray
            - 🧹 Clear web cache
            - 🚪 Minimize-to-tray on close (stays running in background)
            - 🔐 Clean OAuth login flow (popup auto-closes after login)
            - 🎯 1250 × 900 default window — perfectly sized for TikTok

            ### ⌨️ Keyboard Shortcuts

            | Key | Action |
            |---|---|
            | `Space` | Play / Pause |
            | `J` / `↓` | Next Video |
            | `K` / `↑` | Previous Video |
            | `←` / `→` | Rewind / Fast-Forward 5s |
            | `M` | Mute / Unmute |
            | `[` / `]` | Volume Down / Up |
            | `L` | Like Video |
            | `F` | Toggle Fullscreen |
            | `P` | Picture-in-Picture |
            | `A` | Toggle Auto-Scroll |
            | `R` | Refresh / Reload Feed |

            ---
            *Authored and maintained with ❤️ by [@benedictusrey](https://github.com/benedictusrey)*
          draft: false
          prerelease: false
          files: |
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64
            dist/checksums.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
