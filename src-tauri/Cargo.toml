[package]
name = "tiktok-now"
version = "2.2.0"
description = "TikTok-Now Desktop Client (Powered by Tauri v2 + Rust)"
authors = ["@benedictusrey"]
edition = "2021"

[lib]
name = "tiktok_now_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TikTok-Now"
path = "src/main.rs"

[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

thiserror = "1"
open = "5.3"

# Windows-only: Core Audio session mute/unmute/branding for the process tree (audio.rs),
# DWM window geometry (geometry.rs), and WebView2 suspend/resume (webview_sleep.rs).
# MUST stay target-gated — the `windows` crate pins windows-future 0.2.1, whose
# non-Windows code paths fail to compile against windows-core 0.61 (imp module
# is #[cfg(windows)]). Ungated, it breaks macOS/Linux CI builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }
# WebView2 suspend/low-mem on hide (webview_sleep.rs). Pinned to the version
# wry 0.55 links so COM interfaces match the platform webview.
webview2-com = "=0.38.2"

# Linux-only: WebKitGTK runtime tuning and DRI3 probe (lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
x11-dl = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
