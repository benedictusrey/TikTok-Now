[package]
name = "tiktok-now"
version = "2.1.0"
description = "TikTok-Now Desktop Client (Powered by Tauri v2 + Rust)"
authors = ["@benedictusrey"]
edition = "2021"

[lib]
name = "tiktok_now_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TikTok-Now"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }

thiserror = "1"
open = "5.3"

# v2.1.0 dependency audit — removed as dead code:
#   tauri-plugin-shell   (never registered; `open` crate does the shell work)
#   tauri-plugin-http    (registered, no permission usage, no fetches)
#   tauri-plugin-store   (registered, no store ever created)
#   tauri-plugin-notification (registered, no notification ever sent)
#   rusqlite (bundled SQLite) + moka + the db/state modules they fed —
#   `AppState` was managed but never read by a single command.

# Windows-only: Core Audio session mute/unmute for the process tree (audio.rs).
# MUST stay target-gated — the `windows` crate pins windows-future 0.2.1, whose
# non-Windows code paths fail to compile against windows-core 0.61 (imp module
# is #[cfg(windows)]). Ungated, it broke the macOS/Linux CI builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
