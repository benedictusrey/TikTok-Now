name: Release TikTok-Now

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

env:
  CARGO_HTTP_CHECK_REVOKE: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Windows Build (x86_64)
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build — Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $src = "src-tauri\target\release\TikTok-Now.exe"
          $dst = "TikTok-Now_${tag}_windows-x86_64.exe"
          Copy-Item $src $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  $dst" | Out-File -Encoding ascii checksums-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            TikTok-Now_${{ inputs.tag || github.ref_name }}_windows-x86_64.exe
            checksums-windows.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # macOS Build — Universal Binary (Apple Silicon + Intel)
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 Build — macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain + cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build for Intel (x86_64)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for Apple Silicon (aarch64)
        working-directory: src-tauri
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary with lipo
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          lipo -create \
            src-tauri/target/x86_64-apple-darwin/release/TikTok-Now \
            src-tauri/target/aarch64-apple-darwin/release/TikTok-Now \
            -output "TikTok-Now_${TAG}_macos-universal"

      - name: Verify Universal Binary Architecture
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          lipo -info "TikTok-Now_${TAG}_macos-universal"

      - name: Make executable & checksum
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          BIN="TikTok-Now_${TAG}_macos-universal"
          chmod +x "$BIN"
          shasum -a 256 "$BIN" > checksums-macos.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            TikTok-Now_${{ inputs.tag || github.ref_name }}_macos-universal
            checksums-macos.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Linux Build — x86_64
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Build — Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKit2GTK + Tauri requirements)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          SRC="src-tauri/target/release/TikTok-Now"
          DST="TikTok-Now_${TAG}_linux-x86_64"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          sha256sum "$DST" > checksums-linux.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            TikTok-Now_${{ inputs.tag || github.ref_name }}_linux-x86_64
            checksums-linux.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release (Consolidated Multi-Platform)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Combine checksums into unified checksums.txt
        run: |
          cat dist/checksums-windows.txt dist/checksums-macos.txt dist/checksums-linux.txt > dist/checksums.txt

      - name: Resolve tag name
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "TikTok-Now ${{ steps.tag.outputs.value }}"
          body: |
            ## 🎬 TikTok-Now Desktop — ${{ steps.tag.outputs.value }}

            A high-performance, ultra-lightweight desktop experience for TikTok powered by **Rust + Tauri v2**.
            Sub-10 MB standalone executable. Zero Electron bloat. Zero telemetry. Pure speed.

            ---

            ### 🚀 Highlights in v2.2.0

            - 🌐 **Issue #1 Fix (Windows HTTP 403)**: Removed stale hardcoded `Chrome/126.0.0.0` user-agent overrides, restored `wry` default WebView2 features (`msWebOOUI,msPdfOOUI,msSmartScreenProtection`) alongside occlusion/overlay/autoplay flags, and removed `no-referrer` from the splash screen.
            - ⬇️ **Standalone Media Downloader (`downloader.html`)**: Stage-anchored top-right Download button (stays clear when Comments open and tracks scrolled For You videos with Comments open or closed) + tray entry supporting authentic original-resolution Videos (`H.264`/`HEVC`/`AAC`, with automatic `music.playUrl` audio muxing for video-only streams), Photo Carousels (`JPG`/`PNG`/`WebP`/`AVIF`/`HEIC`), Audio `.m4a`, Animated GIF export, and Full Post bundles via system `curl` + optional `ffmpeg` with strict TikTok-only cookie isolation.
            - 🖱️ **Double-Click-to-Like Selection Fix**: Scoped `user-select: none` and `selectstart`/`dblclick` guards to player surfaces so double-clicking to like no longer highlights the whole viewport while comments, captions, inputs, and DMs keep native selection.
            - 🔊 **Windows Volume Mixer Branding & Audio**: Sessions display `"TikTok-Now"` with the executable icon across active render endpoints (`EnumAudioEndpoints`), backed by a crash-safe `audio-muted.flag` recovery marker and foreground audio readiness.
            - ⚡ **Cross-Platform Performance & Polish**: Added targeted `scrollFeedBy` scrolling, `prefers-reduced-motion` support, Windows WebView2 hide-sleep (`TrySuspend`/`Resume`), Linux WebKitGTK/Wayland runtime tuning, macOS Dock `Reopen` and `WKWebView` OAuth `window.opener` fixes, and universal work-area window clamping across all OSes.

            ---

            ### 📦 Download Matrix

            | Platform | File | Architecture |
            | :--- | :--- | :--- |
            | 🪟 **Windows** | `TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe` | x86_64 (Standalone) |
            | 🍎 **macOS** | `TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal` | Universal (Intel + Apple Silicon) |
            | 🐧 **Linux** | `TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64` | x86_64 (GTK3 + WebKit2GTK 4.1) |

            *Cryptographic SHA-256 hashes for all binaries are provided in `checksums.txt`.*

            ### Quick Execution
            - **Windows**: Run `TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe` directly (no installer needed).
            - **macOS**: `chmod +x TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal && ./TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal`
            - **Linux**: `chmod +x TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64 && ./TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64`

            ---
            *Authored and maintained with ❤️ by **Benedictus Reynaldo Hartanto** ([@benedictusrey](https://github.com/benedictusrey))*
          draft: false
          prerelease: false
          files: |
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64
            dist/checksums.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
