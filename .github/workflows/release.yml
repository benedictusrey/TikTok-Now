name: Release TikTok-Now

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

env:
  CARGO_HTTP_CHECK_REVOKE: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Windows Build (x86_64)
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build — Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $src = "src-tauri\target\release\TikTok-Now.exe"
          $dst = "TikTok-Now_${tag}_windows-x86_64.exe"
          Copy-Item $src $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  $dst" | Out-File -Encoding ascii checksums-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            TikTok-Now_${{ inputs.tag || github.ref_name }}_windows-x86_64.exe
            checksums-windows.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # macOS Build — Universal Binary (Apple Silicon + Intel)
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 Build — macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain + cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build for Intel (x86_64)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for Apple Silicon (aarch64)
        working-directory: src-tauri
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary with lipo
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          lipo -create \
            src-tauri/target/x86_64-apple-darwin/release/TikTok-Now \
            src-tauri/target/aarch64-apple-darwin/release/TikTok-Now \
            -output "TikTok-Now_${TAG}_macos-universal"

      - name: Verify Universal Binary Architecture
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          lipo -info "TikTok-Now_${TAG}_macos-universal"

      - name: Make executable & checksum
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          BIN="TikTok-Now_${TAG}_macos-universal"
          chmod +x "$BIN"
          shasum -a 256 "$BIN" > checksums-macos.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            TikTok-Now_${{ inputs.tag || github.ref_name }}_macos-universal
            checksums-macos.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Linux Build — x86_64
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Build — Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKit2GTK + Tauri requirements)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          SRC="src-tauri/target/release/TikTok-Now"
          DST="TikTok-Now_${TAG}_linux-x86_64"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          sha256sum "$DST" > checksums-linux.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            TikTok-Now_${{ inputs.tag || github.ref_name }}_linux-x86_64
            checksums-linux.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release (Consolidated Multi-Platform)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Combine checksums into unified checksums.txt
        run: |
          cat dist/checksums-windows.txt dist/checksums-macos.txt dist/checksums-linux.txt > dist/checksums.txt

      - name: Resolve tag name
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "TikTok-Now ${{ steps.tag.outputs.value }}"
          body: |
            ## 🎬 TikTok-Now Desktop — ${{ steps.tag.outputs.value }}

            A high-performance, ultra-lightweight desktop experience for TikTok powered by **Rust + Tauri v2**.
            Sub-10 MB standalone executable. Zero Electron bloat. Zero telemetry. Pure speed.

            ---

            ### 🚀 Highlights in v2.1.0

            - ⚡ **Near-Instant Launch (350 ms)**: Splash redirect reduced from 2.2s to 350ms via `location.replace` (no splash bounce in back history) with proactive TLS/DNS pre-warming and offline auto-recovery.
            - 💬 **First-Class Direct Messages**: Dedicated **💬 Direct Messages** tray menu navigation (`/messages`) with a DM-aware engine that guards keyboard inputs, disables synthetic clicks in chat, and skips auto-scroll.
            - 🪟 **Exact Work-Area Window Fit (1326 × 1032)**: Automatically derived from runtime DWM extended frame bounds and monitor work areas, flush with top of screen and taskbar across 100%, 125%, and 150% DPI scalings.
            - 🌑 **Flash-Free Transitions**: Dark canvas painted at true document-start (MutationObserver) before the first frame commit, eliminating white/black flashes on startup, tray feed switching, and login popups.
            - 🔒 **Comprehensive Security Auditing**: Scheme-whitelisted external URL opening (`http`, `https`, `mailto`), exact-domain matching for OAuth popups, zero diagnostic leakage in release builds (`diag!` macro), strict local CSP, and 6 dead dependencies removed.
            - ✨ **Honest UX Refinements**: Verified clipboard status for "URL copied", non-destructive tray restore, stateful tray labels, and complete cache purging across Cache Storage and service workers.
            - 🎯 **All Core Features Preserved**: Smart autoplay with sound at 50% on startup, photo carousel dragging, guaranteed pause-on-minimize with OS-level audio session mute, system tray integration, and picture-in-picture.

            ---

            ### 📦 Download Matrix

            | Platform | File | Architecture |
            | :--- | :--- | :--- |
            | 🪟 **Windows** | `TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe` | x86_64 (Standalone) |
            | 🍎 **macOS** | `TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal` | Universal (Intel + Apple Silicon) |
            | 🐧 **Linux** | `TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64` | x86_64 (GTK3 + WebKit2GTK 4.1) |

            *Cryptographic SHA-256 hashes for all binaries are provided in `checksums.txt`.*

            ### Quick Execution
            - **Windows**: Run `TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe` directly (no installer needed).
            - **macOS**: `chmod +x TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal && ./TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal`
            - **Linux**: `chmod +x TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64 && ./TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64`

            ---
            *Authored and maintained with ❤️ by **Benedictus Reynaldo Hartanto** ([@benedictusrey](https://github.com/benedictusrey))*
          draft: false
          prerelease: false
          files: |
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_windows-x86_64.exe
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_macos-universal
            dist/TikTok-Now_${{ steps.tag.outputs.value }}_linux-x86_64
            dist/checksums.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
